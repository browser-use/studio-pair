name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: ./scripts/build.sh
      - run: python3 tests/recovery_check.py
      - run: python3 -m py_compile scripts/manage.py scripts/hardware_check.py
